<app-shell>
  <div class="xanhla-container" style="padding:56px max(24px,4vw)">
    <div class="xanhla-sec-header-center">
      <h1 class="xanhla-sec-title">Fresh Ingredients</h1>
      <p class="xanhla-sec-desc">Khám phá thực đơn nguyên liệu sạch từ trang trại Xanh Lá cho bữa ăn dinh dưỡng trọn vẹn mỗi ngày.</p>
    </div>

    @for (sec of sections; track sec.title) {
      <div style="margin-bottom:64px">
        <h2 style="font-family:var(--xanh-font-display);font-size:26px;border-bottom:2px solid var(--xanh-moss);padding-bottom:10px;margin-bottom:28px">
          {{ sec.title }}
        </h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px">
          @for (prod of sec.items; track prod.id) {
            <div style="display:flex;gap:16px;background:#fff;padding:16px;border-radius:var(--xanh-radius-md);border:1px solid var(--xanh-line)">
              <img [src]="prod.image" [alt]="prod.name"
                   style="width:88px;height:88px;border-radius:var(--xanh-radius-sm);object-fit:cover" />
              <div style="flex:1;display:flex;flex-direction:column">
                <h4 style="margin:0 0 4px 0;font-size:16px">{{ prod.name }}</h4>
                <p style="margin:0 0 8px 0;font-size:13px;color:var(--xanh-muted);flex:1">{{ prod.description }}</p>
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <strong style="color:var(--xanh-moss)">{{ prod.price }}</strong>
                  <button class="xanhla-btn-outline" type="button"
                          style="padding:4px 12px;font-size:13px" (click)="addToCart(prod)">
                    + Gọi món
                  </button>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</app-shell>
