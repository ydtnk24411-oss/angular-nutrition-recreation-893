<app-shell>
  <div class="xanhla-container" style="padding:56px max(24px,4vw)">
    <div class="xanhla-sec-header-center">
      <h1 class="xanhla-sec-title">Sự kiện Xanh Lá</h1>
      <p class="xanhla-sec-desc">Các buổi workshop, lớp học và ngày hội để cùng học, cùng nấu và cùng ăn ngon hơn.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:32px;max-width:880px;margin:0 auto">
      @for (event of events; track event.id) {
        <article style="display:grid;grid-template-columns:240px 1fr;gap:28px;background:#fff;border:1px solid var(--xanh-line);border-radius:var(--xanh-radius-md);overflow:hidden;box-shadow:var(--xanh-shadow-sm)">
          <img [src]="event.image" [alt]="event.name" style="width:100%;height:100%;object-fit:cover" />
          <div style="padding:28px 24px;display:flex;flex-direction:column">
            <div style="display:flex;align-items:center;gap:16px;color:var(--xanh-muted);font-size:14px;margin-bottom:8px">
              <span>📅 {{ event.date }}</span>
              <span>📍 {{ event.location }}</span>
            </div>
            <h3 style="font-family:var(--xanh-font-display);font-size:22px;margin:0 0 10px 0">{{ event.name }}</h3>
            <p style="color:var(--xanh-muted);font-size:15px;margin-bottom:20px;flex:1">{{ event.description }}</p>
            <div style="display:flex;gap:12px">
              <a class="xanhla-btn-outline" [routerLink]="event.slug">Thông tin khác</a>
              <a class="xanhla-btn-primary" [routerLink]="event.slug">{{ event.action }}</a>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</app-shell>
